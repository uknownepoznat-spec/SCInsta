# Inspired heavily by the following workflows
# https://github.com/arichornlover/uYouEnhanced/blob/main/.github/workflows/buildapp.yml
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml
# https://github.com/BandarHL/BHTwitter/actions/workflows/build.yml

name: Build and Package SCInsta

on:
    workflow_dispatch:
        inputs:
            decrypted_instagram_url:
                description: "The direct URL to the decrypted Instagram IPA"
                default: ""
                required: true
                type: string
            upload_artifact:
                description: "Upload Artifact"
                default: true
                required: false
                type: boolean
  
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Build SCInsta
        runs-on: macos-15-intel
        permissions:
            contents: write

        steps:
            - name: Checkout Main
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Check source contracts
              shell: pwsh
              working-directory: main
              run: ./tests/check-source.ps1

            - name: Test IPA packaging checks
              shell: pwsh
              working-directory: main
              run: ./tests/check-ipa-contracts.ps1

            - name: Setup Node for license protocol tests
              uses: actions/setup-node@v4
              with:
                node-version: '24'

            - name: Install license test dependencies
              working-directory: main/server/keyaux-worker
              run: npm ci --no-fund

            - name: Test license Worker without live secrets
              working-directory: main/server/keyaux-worker
              run: node --test

            - name: Install Dependencies
              run: brew install ldid dpkg make

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH 

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive
        
            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Prepare Instagram IPA
              run: |
                cd main

                mkdir -p packages
                wget "$Instagram_URL" --no-verbose -O packages/com.burbn.instagram.ipa

                ls -la packages
                
              env:
                THEOS: ${{ github.workspace }}/theos
                Instagram_URL: ${{ inputs.decrypted_instagram_url }}

            - name: Get SCInsta Version
              id: scinsta_version
              run: |
                SCINSTA_VERSION=$(awk '/Version:/ {print $2}' main/control)

                echo "SCINSTA_VERSION=${SCINSTA_VERSION}" >> "$GITHUB_ENV"
                echo "version=${SCINSTA_VERSION}" >> "$GITHUB_OUTPUT"
            
            - name: Build SCInsta tweak for sideloading (as IPA)
              run: |
                pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
                
                cd main
                if [ "$(uname -m)" = "x86_64" ]; then
                  IPAPATCH_ARCH="macos-amd64"
                else
                  IPAPATCH_ARCH="macos-arm64"
                fi
                curl -Lo ipapatch "https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.${IPAPATCH_ARCH}"
                chmod +x ipapatch
                export PATH=.:$PATH
                ls -la

                ./build.sh sideload
                ls -la packages
                
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Rename IPA to include version info
              run: |
                set -euo pipefail
                SOURCE_IPA="main/packages/Peki Scripter-sideloaded.ipa"
                TARGET_IPA="main/packages/SCInsta_sideloaded_v${SCINSTA_VERSION}.ipa"
                test -s "$SOURCE_IPA"
                mv -- "$SOURCE_IPA" "$TARGET_IPA"

            - name: Verify injected license gate before upload
              shell: pwsh
              working-directory: main
              run: ./tests/check-ipa.ps1 -Path "packages/SCInsta_sideloaded_v${{ steps.scinsta_version.outputs.version }}.ipa"

            - name: Pass package name to upload action
              id: package_name
              run: |
                echo "package=SCInsta_sideloaded_v${SCINSTA_VERSION}.ipa" >> "$GITHUB_OUTPUT"

            - name: Upload Artifact
              if: ${{ inputs.upload_artifact }}
              uses: actions/upload-artifact@v4
              with:
                name: SCInsta_sideloaded_v${{ steps.scinsta_version.outputs.version }}
                path: ${{ github.workspace }}/main/packages/${{ steps.package_name.outputs.package }}
                if-no-files-found: error

            - name: Create Release
              uses: softprops/action-gh-release@v2.0.6
              with:
                name: SCInsta_sideloaded_v${{ steps.scinsta_version.outputs.version }}
                files: ${{ github.workspace }}/main/packages/SCInsta_sideloaded_v*.ipa
                draft: true

            - name: Output Release URL
              run: |
                echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
